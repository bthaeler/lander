<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>devshot</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<canvas id="screen"></canvas>
<script type="module">
// Harness: renders one game state statically so it can be screenshot.
// ?screen=hangar|flight|orbit|map|result  &level=N &hud=N &alt=METRES
import { Renderer } from '../js/render.js';
import { Input } from '../js/input.js';
import { Game } from '../js/game.js';

const params = new URLSearchParams(location.search);
const screen = params.get('screen') || 'hangar';
const level = Number(params.get('level') || 0);
const hud = Number(params.get('hud') || 0);
const alt = Number(params.get('alt') || 200);

const canvas = document.getElementById('screen');
const renderer = new Renderer(canvas);
const input = new Input();
const game = new Game(renderer, input);
game.hudLayout = hud;
game.session.credits = 400000;
game.loadLevel(level);   // also sets session.levelIndex, which gates part unlocks

// A vehicle with enough margin to be placed anywhere for a screenshot.
if (screen !== 'hangar') {
  game.session.design = {
    rcs: 2, legs: 2, lifeSupport: 6,
    stages: [
      { engineId: 've1', engineCount: 1, fuel: 12000 },
      { engineId: 'lm2', engineCount: 1, fuel: 2500 },
    ],
  };
}

/** Drop the ship to a given altitude over a pad, descending and burning. */
function place(altitude, tilt = 0, vs = -12, hs = 4) {
  const body = game.body;
  const pad = body.pads[0];
  const theta = pad.theta + 900 / body.radius;
  const r = body.surfaceRadius(theta) + altitude;
  const ship = game.ship;
  ship.x = r * Math.cos(theta);
  ship.y = r * Math.sin(theta);
  const ur = { x: Math.cos(theta), y: Math.sin(theta) };
  const ut = { x: -ur.y, y: ur.x };
  ship.vx = ur.x * vs + ut.x * hs;
  ship.vy = ur.y * vs + ut.y * hs;
  ship.angle = theta - tilt;
  ship.landed = false;
  ship.spool = 0.8;
}

if (screen === 'hangar') {
  game.state = 'hangar';
  // Give the hangar something interesting to show.
  game.session.design = {
    rcs: 1, legs: 1, lifeSupport: 3,
    stages: [
      { engineId: 'bs1', engineCount: 2, fuel: 60000 },
      { engineId: 've1', engineCount: 1, fuel: 14000 },
      { engineId: 'lm2', engineCount: 1, fuel: 2200 },
    ],
  };
  game.hangar.selection = Number(params.get('sel') || 2);
} else {
  game.launch();
  if (screen === 'flight') place(alt, 0.22);
  if (screen === 'orbit' || screen === 'map') {
    // Level 6 already spawns in orbit; give it an eccentric one to show markers.
    const body = game.body;
    const r = body.radius + 60000;
    const v = body.circularSpeed(r) * 1.22;
    game.ship.x = r; game.ship.y = 0;
    game.ship.vx = 0; game.ship.vy = v;
    game.ship.angle = Math.PI / 2;
    game.ship.landed = false;
    game.missionTime = 2450;
    game.warpIndex = 5;
  }
  if (screen === 'map') game.mapView = true;
  if (screen === 'result') {
    place(60, 0.05, -1.2, 0.3);
    game.lastTouchdown = {
      speed: 1.42, tiltDeg: 2.3, pad: game.body.pads[0],
      limitSpeed: 7.4, limitAngle: 21, slope: 0.4,
    };
    game.missionTime = 1840;
    game.ship.sampleMass = 240;
    for (const o of game.mission.objectives) o.done = true;
    game.mission.activeIndex = game.mission.objectives.length;
    game.succeed();
  }
  game.updateCamera(10);   // snap the camera rather than easing into place
}

game.draw(1 / 60);
document.title = 'ready';
</script>
</body>
</html>
